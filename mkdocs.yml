          - mnoziny/zapis-mnozin.md
          - mnoziny/prazdna-mnozina.md
          - mnoziny/podmnozina.md
          - mnoziny/potencni-mnozina.md
      - Operace:
          - mnoziny/vennovy-diagramy.md
          - mnoziny/sjednoceni.md
          - mnoziny/prunik.md
          - mnoziny/rozdil.md
          - mnoziny/doplnek.md
          - mnoziny/symetricka-diference.md
          - mnoziny/zakony.md
      - Dál:
          - mnoziny/kartezsky-soucin.md
          - mnoziny/mohutnost.md
          - mnoziny/ciselne-mnoziny.md
          - mnoziny/intervaly.md
      - Nástroje:
          - mnoziny/kalkulacka.md
  - Dělitelnost:
      - delitelnost/index.md
      - delitelnost/delitel-a-nasobek.md
      - delitelnost/prvocisla.md
      - delitelnost/nsd.md
      - delitelnost/nsn.md
      - delitelnost/eukleiduv-algoritmus.md
      - delitelnost/slovni-ulohy.md
  - Matice:
      - matice/index.md
      - matice/matice.md
      - matice/operace.md
      - matice/schodovity-tvar.md
      - Determinant:
